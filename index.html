<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>—</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
  }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  'use strict';

  // ---------------------------------------------------------------
  // CANVAS SETUP
  // ---------------------------------------------------------------
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  document.addEventListener('contextmenu', e => e.preventDefault());

  const FONT = '-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif';

  function rand(a, b) { return a + Math.random() * (b - a); }
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  // ---------------------------------------------------------------
  // TIME SYSTEM — an independent timeline
  //
  // displayedMs is its own clock. It starts in sync with real time,
  // then advances by dt each frame. Interaction bends its rate or
  // pushes it backward. It NEVER re-syncs with the system clock:
  // every distortion is permanent — a new local timeline.
  // ---------------------------------------------------------------
  let displayedMs = Date.now();   // synced once, at the beginning. never again.

  // hold state
  let holding = false;
  let holdStartT = 0;
  let breakPoint = 0;
  let nextJumpAt = 0;
  let driftRate = 1.4;    // backward speed while bending time
  let resistRate = 1.5;   // forward speed when the system pushes back

  // disturbance (visual trace of any time event — mine or "someone else's")
  let disturbUntil = 0;
  let disturbAmp = 0;       // px amplitude of digit jitter
  let disturbSeed = 0;

  function disturb(amp, dur) {
    disturbUntil = performance.now() + dur;
    disturbAmp = amp;
    disturbSeed = Math.random() * 1000;
  }

  function beginHold(now) {
    holding = true;
    holdStartT = now;
    breakPoint = rand(4000, 6000);
    nextJumpAt = now + rand(500, 900);
    driftRate = rand(1.1, 1.8);
    resistRate = rand(1.3, 1.9);
  }

  function endHold() { holding = false; }

  // ---------------------------------------------------------------
  // COLLECTIVE TIME INTERACTION
  // a number of other "users" (0–10) are bending time right now.
  // they exist only through the behavior of time itself.
  // ---------------------------------------------------------------
  let othersCount = Math.round(rand(1, 4));
  let othersMood  = othersCount;          // slow baseline the count drifts around
  let nextOthersShiftAt = performance.now() + rand(2000, 4000);
  let nextMoodShiftAt   = performance.now() + rand(15000, 35000);
  let countChangedAt    = 0;              // for the subtle fade of the label

  let nextOthersJumpAt = performance.now() + rand(2000, 5000);
  let freezeUntil = 0;
  let wobbleSeed = Math.random() * 1000;

  function updateOthers(now) {
    // the "mood" drifts slowly — quiet periods and busy periods
    if (now >= nextMoodShiftAt) {
      othersMood = Math.round(rand(0, 8));
      nextMoodShiftAt = now + rand(15000, 40000);
    }
    // every 2–4s the count takes a small organic step toward the mood
    if (now >= nextOthersShiftAt) {
      const pull = Math.sign(othersMood - othersCount);
      let step = pull * (Math.random() < 0.6 ? 1 : 2);
      if (Math.random() < 0.25) step = Math.round(rand(-1, 1)); // hesitation
      const prev = othersCount;
      othersCount = Math.max(0, Math.min(10, othersCount + step));
      if (othersCount !== prev) countChangedAt = now;
      nextOthersShiftAt = now + rand(2000, 4000);
    }
  }

  // continuous backward pull from other users (rate delta, negative)
  function othersRateDelta(now) {
    const n = othersCount;
    if (n <= 0) return 0;
    let delta;
    if (n === 1)      delta = -0.12;                    // subtle drift
    else if (n <= 3)  delta = -(0.30 + 0.15 * (n - 2)); // moderate
    else if (n <= 6)  delta = -(0.55 + 0.12 * (n - 4)); // strong
    else              delta = -(0.90 + 0.18 * (n - 7)); // aggressive
    // 7+: irregular movement — the rate itself trembles
    if (n >= 7) delta += Math.sin(now * 0.004 + wobbleSeed) * 0.45;
    return delta;
  }

  // discrete events from other users: jumps and freezes
  function othersEvents(now) {
    const n = othersCount;
    if (n < 4 || now < nextOthersJumpAt) return;
    if (n <= 6) {
      // strong jumps backward, 3–6 seconds
      displayedMs -= rand(3000, 6000);
      disturb(rand(1.6, 2.4), rand(140, 260));
      nextOthersJumpAt = now + rand(2500, 5500);
    } else {
      // 7+: large jumps, occasional freeze
      if (Math.random() < 0.3) {
        freezeUntil = now + rand(300, 1000);
        disturb(rand(1.0, 1.6), rand(200, 380));
      } else {
        displayedMs -= rand(3000, 7000);
        disturb(rand(2.2, 3.2), rand(160, 300));
      }
      nextOthersJumpAt = now + rand(1400, 3200);
    }
  }

  // total presence — a quieter, slower number
  let activeUsers = Math.round(rand(24, 52));
  let nextActiveShiftAt = performance.now() + rand(60000, 120000);

  function updateUsers(now) {
    if (now >= nextActiveShiftAt) {
      const delta = (Math.random() < 0.5 ? -1 : 1) * (Math.random() < 0.35 ? 2 : 1);
      activeUsers = Math.max(7, activeUsers + delta);
      nextActiveShiftAt = now + rand(60000, 120000);
    }
  }

  // ---------------------------------------------------------------
  // TIME UPDATE — the timeline only knows dt, never the system clock.
  // influences COMBINE: my hold + everyone else, on the same clock.
  // ---------------------------------------------------------------
  function updateTimeSystem(now, dt) {
    updateOthers(now);
    othersEvents(now);

    let rate = 1;   // normal forward ticking — the default state

    if (holding) {
      const held = now - holdStartT;
      if (held < breakPoint) {
        // time drifts backwards
        rate = -driftRate;
        if (now >= nextJumpAt) {
          displayedMs -= rand(800, 2000);          // glitch jump back
          nextJumpAt = now + rand(500, 900);
          disturb(rand(1.8, 2.6), rand(90, 160));
        }
      } else {
        // the system resists: time pushes forward again —
        // but along its own timeline, not toward real time
        rate = resistRate;
        if (now >= nextJumpAt) {
          displayedMs += rand(200, 700);           // small forward jerk
          nextJumpAt = now + rand(700, 1400);
          disturb(rand(1.2, 2.0), rand(60, 120));
        }
      }
    }

    // other users pull at the same clock, whether I touch it or not
    rate += othersRateDelta(now);

    // a freeze wins over forward motion, but not over backward pulls
    if (now < freezeUntil) rate = Math.min(rate, 0);

    displayedMs += rate * dt * 1000;
    // no decay, no resync. wherever time ends up — that is time now.
  }

  function displayedDate() {
    return new Date(displayedMs);
  }

  function hhmm(d) { return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }

  // ---------------------------------------------------------------
  // SCREENS / TRANSITION — horizontal
  // view: 0 = TIME, 1 = NEWS
  // ---------------------------------------------------------------
  let view = 0;
  let viewTarget = 0;
  let viewVel = 0;
  let dragging = false;

  function updateView(dt) {
    if (dragging) return;
    const stiffness = 26, damping = 10.5;
    const accel = (viewTarget - view) * stiffness - viewVel * damping;
    viewVel += accel * dt;
    view += viewVel * dt;
    if (Math.abs(view - viewTarget) < 0.0006 && Math.abs(viewVel) < 0.0006) {
      view = viewTarget; viewVel = 0;
    }
  }

  // ---------------------------------------------------------------
  // INPUT — hold vs swipe must not conflict
  // ---------------------------------------------------------------
  const HOLD_CANCEL_DIST = 10;
  const SWIPE_DIST = 80;

  let pointerDown = false;
  let startX = 0, startY = 0;
  let lastX = 0;
  let holdCandidate = false;
  let viewAtStart = 0;
  let downTime = 0;

  // nav button rects, updated each frame by the renderer
  // { x, y, w, h } in screen coordinates, or null when not visible
  let timeBtnRect = null;   // on TIME screen → goes to news
  let newsBtnRect = null;   // on NEWS screen → goes back to time

  function inRect(x, y, r) {
    return r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
  }

  function onDown(x, y) {
    pointerDown = true;
    startX = x; startY = y; lastX = x;
    holdCandidate = true;
    viewAtStart = viewTarget;
    downTime = performance.now();
    beginHold(downTime);
  }

  function onMove(x, y) {
    if (!pointerDown) return;
    const dx = x - startX, dy = y - startY;
    const dist = Math.hypot(dx, dy);

    if (holdCandidate && dist > HOLD_CANCEL_DIST) {
      holdCandidate = false;
      endHold();
    }

    if (!holdCandidate && Math.abs(dx) > Math.abs(dy) * 0.7) {
      // horizontal drag steers the transition directly
      dragging = true;
      const progress = viewAtStart + (-dx / W) * 1.15;
      view = Math.max(0, Math.min(1, progress));
      viewVel = (x - lastX) / W * -60;
    }
    lastX = x;
  }

  function onUp(x, y) {
    if (!pointerDown) return;
    pointerDown = false;

    if (holdCandidate) {
      endHold();
      holdCandidate = false;
      dragging = false;

      // quick tap on a nav button → navigate
      const quick = performance.now() - downTime < 400;
      if (quick) {
        if (view < 0.5 && inRect(x, y, timeBtnRect)) viewTarget = 1;
        else if (view >= 0.5 && inRect(x, y, newsBtnRect)) viewTarget = 0;
      }
      return;
    }

    dragging = false;
    const dx = x - startX;
    if (dx < -SWIPE_DIST)      viewTarget = 1;   // swipe left → news
    else if (dx > SWIPE_DIST)  viewTarget = 0;   // swipe right → time
    else                       viewTarget = viewAtStart;
  }

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    onDown(t.clientX, t.clientY);
  }, { passive: false });

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    onMove(t.clientX, t.clientY);
  }, { passive: false });

  canvas.addEventListener('touchend', e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    onUp(t.clientX, t.clientY);
  }, { passive: false });

  canvas.addEventListener('touchcancel', e => {
    e.preventDefault();
    endHold(); pointerDown = false; holdCandidate = false; dragging = false;
    viewTarget = Math.round(view);
  }, { passive: false });

  canvas.addEventListener('mousedown', e => { e.preventDefault(); onDown(e.clientX, e.clientY); });
  window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
  window.addEventListener('mouseup',   e => onUp(e.clientX, e.clientY));

  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') viewTarget = 1;  // → news
    if (e.key === 'ArrowLeft')  viewTarget = 0;  // ← time
  });

  // ---------------------------------------------------------------
  // NEWS — minimal real-time feed
  // every timestamp = displayedTime - X minutes
  // ---------------------------------------------------------------
  const NEWS = [
    { title: 'Ceasefire negotiations continue into a second day', minutesAgo: 6  },
    { title: 'New tech regulation announced ahead of summit',     minutesAgo: 14 },
    { title: 'Markets show early signs of recovery',              minutesAgo: 22 },
    { title: 'Climate report released, targets under review',     minutesAgo: 31 },
    { title: 'Local election results expected by evening',        minutesAgo: 39 },
    { title: 'Transit authority reports delays on main lines',    minutesAgo: 47 },
    { title: 'Forecast: slight drop in temperatures overnight',   minutesAgo: 56 },
    { title: 'Court hearing on data privacy case postponed',      minutesAgo: 68 },
  ];

  function wrapText(text, maxWidth, maxLines) {
    const words = text.split(' ');
    const lines = [];
    let line = '';
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = w;
        if (lines.length === maxLines - 1) break;
      } else {
        line = test;
      }
    }
    if (line && lines.length < maxLines) lines.push(line);
    return lines;
  }

  // ---------------------------------------------------------------
  // RENDER
  // ---------------------------------------------------------------
  const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  // minimal pill button; returns its rect in absolute screen coords
  function drawNavButton(label, cx, cy, alpha, xOff) {
    const base = Math.min(W, 430);
    const fontSize = Math.round(base * 0.034);
    ctx.font = `400 ${fontSize}px ${FONT}`;
    const textW = ctx.measureText(label).width;
    const padX = base * 0.06, padY = base * 0.030;
    const w = textW + padX * 2;
    const h = fontSize + padY * 2;
    const x = cx - w / 2, y = cy - h / 2;

    ctx.globalAlpha = alpha * 0.35;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, h / 2);
    else ctx.rect(x, y, w, h);
    ctx.stroke();

    ctx.globalAlpha = alpha * 0.55;
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText(label, cx, cy + fontSize * 0.34);

    // generous hit area (extra padding for fingers)
    const pad = 12;
    return { x: x + xOff - pad, y: y - pad, w: w + pad * 2, h: h + pad * 2 };
  }

  function jitter(now) {
    // baseline instability from other users — more users, less stillness
    const n = othersCount;
    const baseAmp = n <= 0 ? 0 : 0.18 + n * 0.16;
    const baseDim = n <= 0 ? 0 : 0.015 + n * 0.011;

    // event disturbance (a jump just landed) on top of the baseline
    let amp = baseAmp, dim = baseDim;
    if (now < disturbUntil) {
      amp = Math.max(amp, disturbAmp);
      dim = Math.max(dim, 0.10 + 0.10 * Math.abs(Math.sin(now * 0.03 + disturbSeed)));
    }
    if (amp <= 0) return { x: 0, y: 0, dim: 0 };

    return {
      x: Math.sin(now * 0.09 + disturbSeed) * amp,
      y: Math.cos(now * 0.115 + disturbSeed * 1.7) * amp * 0.5,
      dim: dim
    };
  }

  function drawTimeScreen(now, alpha, xOff) {
    ctx.save();
    ctx.translate(xOff, 0);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';

    const d = displayedDate();
    const j = jitter(now);
    const base = Math.min(W, 430);
    const cx = W / 2;
    const cy = H * 0.40;

    // date
    ctx.globalAlpha = alpha * 0.55;
    ctx.font = `300 ${Math.round(base * 0.045)}px ${FONT}`;
    ctx.fillText(`${DAYS[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}`, cx, cy - base * 0.27);

    // HH:MM
    const timeSize = base * 0.30;
    ctx.font = `100 ${Math.round(timeSize)}px ${FONT}`;
    if (j.dim > 0) {
      ctx.globalAlpha = alpha * 0.16;
      ctx.fillText(hhmm(d), cx - j.x * 2.4, cy - j.y * 2.4); // ghost
    }
    ctx.globalAlpha = alpha * (1 - j.dim);
    ctx.fillText(hhmm(d), cx + j.x, cy + j.y);

    // seconds + ms
    const ms = d.getMilliseconds();
    ctx.globalAlpha = alpha * (0.38 - j.dim * 0.5);
    ctx.font = `200 ${Math.round(base * 0.052)}px ${FONT}`;
    ctx.fillText(`${pad2(d.getSeconds())}.${String(ms).padStart(3, '0')}`, cx + j.x * 0.5, cy + timeSize * 0.62);

    // presence — quiet, factual, no icons
    ctx.globalAlpha = alpha * 0.22;
    ctx.font = `300 ${Math.round(base * 0.030)}px ${FONT}`;
    ctx.fillText(`${activeUsers} users are active now`, cx, cy + timeSize * 0.95);

    // "X users are affecting time" — breathes, updates live
    const breathe = 0.78 + 0.22 * Math.sin(now * 0.0009 + 1.3);
    const sinceChange = now - countChangedAt;
    const changePulse = sinceChange < 900 ? (1 - sinceChange / 900) * 0.35 : 0;
    const affectText =
      othersCount === 0 ? 'no one is affecting time' :
      othersCount === 1 ? '1 user is affecting time' :
      `${othersCount} users are affecting time`;
    ctx.globalAlpha = alpha * (0.30 * breathe + changePulse) * (othersCount === 0 ? 0.55 : 1);
    ctx.font = `300 ${Math.round(base * 0.032)}px ${FONT}`;
    ctx.fillText(affectText, cx, cy + timeSize * 0.95 + base * 0.052);

    // hints + nav button
    ctx.globalAlpha = alpha * 0.30;
    ctx.font = `300 ${Math.round(base * 0.034)}px ${FONT}`;
    ctx.fillText('HOLD TO SLOW TIME', cx, H - H * 0.155);

    timeBtnRect = drawNavButton('NEWS', cx, H - H * 0.075, alpha, xOff);

    ctx.restore();
  }

  function drawNewsScreen(now, alpha, xOff) {
    ctx.save();
    ctx.translate(xOff, 0);
    ctx.fillStyle = '#fff';

    const d = displayedDate();
    const base = Math.min(W, 430);
    const margin = Math.max(22, W * 0.07);

    // header — like a live wire feed, but silent
    ctx.textAlign = 'left';
    ctx.globalAlpha = alpha * 0.85;
    ctx.font = `400 ${Math.round(base * 0.046)}px ${FONT}`;
    ctx.fillText('Newsflash', margin, H * 0.105);

    ctx.textAlign = 'right';
    ctx.globalAlpha = alpha * 0.30;
    ctx.font = `200 ${Math.round(base * 0.036)}px ${FONT}`;
    ctx.fillText(hhmm(d), W - margin, H * 0.105);

    ctx.globalAlpha = alpha * 0.12;
    ctx.fillRect(margin, H * 0.105 + base * 0.035, W - margin * 2, 1);

    // list
    const titleSize = Math.round(base * 0.042);
    const lineH = titleSize * 1.32;
    const stampSize = Math.round(base * 0.032);
    let y = H * 0.105 + base * 0.035 + base * 0.085;

    ctx.textAlign = 'left';
    for (let i = 0; i < NEWS.length; i++) {
      const item = NEWS[i];
      const t = new Date(d.getTime() - item.minutesAgo * 60000);

      ctx.font = `400 ${titleSize}px ${FONT}`;
      const lines = wrapText(item.title, W - margin * 2, 2);

      ctx.globalAlpha = alpha * 0.92;
      for (let li = 0; li < lines.length; li++) {
        ctx.fillText(lines[li], margin, y + li * lineH);
      }
      const blockBottom = y + (lines.length - 1) * lineH;

      // timestamp — derived from the distorted clock
      ctx.globalAlpha = alpha * 0.34;
      ctx.font = `300 ${stampSize}px ${FONT}`;
      const stamp = i === 0
        ? `${item.minutesAgo} minutes ago`   // top item, like a live feed
        : hhmm(t);
      ctx.fillText(stamp, margin, blockBottom + stampSize * 1.45);

      const itemBottom = blockBottom + stampSize * 1.45 + base * 0.038;

      ctx.globalAlpha = alpha * 0.09;
      ctx.fillRect(margin, itemBottom, W - margin * 2, 1);

      y = itemBottom + base * 0.062;
      if (y > H - base * 0.18) break;
    }

    // nav button
    newsBtnRect = drawNavButton('TIME', W / 2, H - H * 0.075, alpha, xOff);

    ctx.restore();
  }

  // ---------------------------------------------------------------
  // MAIN LOOP
  // ---------------------------------------------------------------
  let prev = performance.now();

  function frame(now) {
    const dt = Math.min((now - prev) / 1000, 0.05);
    prev = now;

    updateTimeSystem(now, dt);
    updateUsers(now);
    updateView(dt);

    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    const v = Math.max(0, Math.min(1, view));

    // TIME screen drifts left and dims
    if (v < 1) {
      const xOff = -v * W * 0.92;
      const a = 1 - v * 0.75;
      drawTimeScreen(now, a, xOff);
    }

    // NEWS screen emerges from the right
    if (v > 0) {
      const xOff = (1 - v) * W;
      const a = 0.25 + v * 0.75;
      drawNewsScreen(now, a, xOff);
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

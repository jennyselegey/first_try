<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time</title>

<style>
html, body {
  margin:0;
  background:#000;
  overflow:hidden;
  touch-action: none;
}
canvas {
  display:block;
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<script>

let canvas = document.getElementById("c");
let ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// ----------------
// TIME SYSTEM
// ----------------
let lag = 0;
let hold = false;
let last = Date.now();
let lastPulse = 0;

let holdStart = 0;
let breakPoint = randomBreak();
let broken = false;

function randomBreak(){
  return 4000 + Math.random()*2000;
}

// ----------------
// SCREEN STATE
// ----------------
let screen = 0; // 0 = time, 1 = news

// swipe
let startX = 0;

canvas.addEventListener("touchstart", e=>{
  startX = e.touches[0].clientX;
  startHold();
}, {passive:false});

canvas.addEventListener("touchend", e=>{
  let dx = e.changedTouches[0].clientX - startX;

  if(Math.abs(dx) > 80){
    screen = screen === 0 ? 1 : 0;
  }

  endHold();
});

// ----------------
// NEWS DATA
// ----------------
let news = [
  {title:"Ceasefire negotiations continue", time: 5},
  {title:"New tech regulation announced", time: 12},
  {title:"Markets show early recovery", time: 25},
  {title:"Climate report released", time: 40},
  {title:"Local elections results expected", time: 60}
];

// ----------------
// LOOP
// ----------------
function tick(){

  let now = Date.now();
  let dt = now - last;
  last = now;

  if(hold){
    let heldTime = now - holdStart;

    if(!broken && heldTime > breakPoint){
      broken = true;
    }

    if(!broken){
      lag += dt * 0.25;

      if(now - lastPulse > 700){
        lag += 800 + Math.random()*1200;
        lastPulse = now;
      }
    } else {
      lag -= dt * 0.2;
    }

  } else {
    lag -= dt * 0.05;
    if(lag < 0) lag = 0;
  }

  let display = new Date(now - lag);

  draw(display);

  requestAnimationFrame(tick);
}

// ----------------
// DRAW
// ----------------
function draw(display){

  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = "#fff";

  if(screen === 0){
    drawTime(display);
  } else {
    drawNews(display);
  }
}

// TIME SCREEN
function drawTime(d){

  let h = pad(d.getHours());
  let m = pad(d.getMinutes());
  let s = pad(d.getSeconds());
  let ms = pad3(d.getMilliseconds());

  ctx.textAlign = "center";

  ctx.font = "200 90px -apple-system";
  ctx.fillText(`${h}:${m}`, canvas.width/2, canvas.height/2);

  ctx.globalAlpha = 0.5;
  ctx.font = "200 22px -apple-system";
  ctx.fillText(`${s}:${ms}`, canvas.width/2, canvas.height/2 + 40);

  ctx.globalAlpha = 0.4;
  ctx.font = "12px -apple-system";
  ctx.fillText("HOLD TO SLOW TIME", canvas.width/2, canvas.height/2 + 100);

  ctx.globalAlpha = 1;
}

// NEWS SCREEN
function drawNews(display){

  ctx.textAlign = "left";

  let now = display.getTime();

  ctx.font = "600 20px -apple-system";

  for(let i=0;i<news.length;i++){

    let y = 120 + i*80;

    let minutesAgo = news[i].time;
    let timestamp = new Date(now - minutesAgo*60000);

    let h = pad(timestamp.getHours());
    let m = pad(timestamp.getMinutes());

    ctx.fillText(news[i].title, 20, y);

    ctx.globalAlpha = 0.5;
    ctx.font = "14px -apple-system";
    ctx.fillText(`${h}:${m}`, 20, y + 25);

    ctx.globalAlpha = 1;
    ctx.font = "600 20px -apple-system";
  }

}

// ----------------
// HELPERS
// ----------------
function pad(n){ return String(n).padStart(2,"0"); }
function pad3(n){ return String(n).padStart(3,"0"); }

// ----------------
// INTERACTION
// ----------------
function startHold(){
  hold = true;
  holdStart = Date.now();
  breakPoint = randomBreak();
  broken = false;
}

function endHold(){
  hold = false;
}

// desktop fallback
canvas.addEventListener("mousedown", startHold);
canvas.addEventListener("mouseup", endHold);

// ----------------
tick();
// ----------------

</script>

</body>
</html>

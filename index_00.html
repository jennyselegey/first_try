<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Time</title>

<style>
* {
  -webkit-user-select: none !important;
  user-select: none !important;
  -webkit-touch-callout: none !important;
}

html, body {
  margin:0;
  background:#000;
  height:100vh;
  overflow:hidden;
  touch-action: manipulation;
}
canvas {
  display:block;
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<script>

// 🔥 убиваем iOS жесты
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("selectstart", e => e.preventDefault());

let canvas = document.getElementById("c");
let ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// --- TIME SYSTEM ---
let lag = 0;
let hold = false;
let last = Date.now();
let lastPulse = 0;

let holdStart = 0;
let breakPoint = randomBreak();
let broken = false;

// --- USERS ---
let activeUsers = 10;
let delayedUsers = 3;

function updateUsers(){
  activeUsers = Math.max(5, Math.min(50, activeUsers + (Math.random() < 0.5 ? 1 : -1)));
  delayedUsers = Math.floor(activeUsers * 0.3);
  setTimeout(updateUsers, 60000);
}
updateUsers();

function randomBreak(){
  return 4000 + Math.random()*2000;
}

function pad(n){ return String(n).padStart(2,"0"); }
function pad3(n){ return String(n).padStart(3,"0"); }

function tick(){

  let now = Date.now();
  let dt = now - last;
  last = now;

  if(hold){
    let heldTime = now - holdStart;

    if(!broken && heldTime > breakPoint){
      broken = true;
    }

    if(!broken){
      lag += dt * 0.25;

      if(now - lastPulse > 700){
        lag += 800 + Math.random()*1200;
        lastPulse = now;
      }
    } else {
      lag -= dt * 0.2;
    }

  } else {
    lag -= dt * 0.05;
    if(lag < 0) lag = 0;
  }

  let display = new Date(now - lag);

  let h = pad(display.getHours());
  let m = pad(display.getMinutes());
  let s = pad(display.getSeconds());
  let ms = pad3(display.getMilliseconds());

  draw(h, m, s, ms);

  requestAnimationFrame(tick);
}

// --- DRAW ---
function draw(h, m, s, ms){

  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "#fff";

  // main time
  ctx.font = "200 90px -apple-system";
  ctx.textAlign = "center";
  ctx.fillText(`${h}:${m}`, canvas.width/2, canvas.height/2);

  // sub
  ctx.globalAlpha = 0.5;
  ctx.font = "200 22px -apple-system";
  ctx.fillText(`${s}:${ms}`, canvas.width/2, canvas.height/2 + 40);

  // CTA
  ctx.globalAlpha = 0.4;
  ctx.font = "12px -apple-system";
  ctx.fillText("HOLD TO SLOW TIME", canvas.width/2, canvas.height/2 + 100);

  // users
  ctx.globalAlpha = 0.4;
  ctx.fillText(`${activeUsers} USERS ARE ACTIVE NOW`, canvas.width/2, canvas.height/2 + 130);
  ctx.fillText(`${delayedUsers} USERS DELAYED TIME`, canvas.width/2, canvas.height/2 + 150);

  ctx.globalAlpha = 1;
}

// --- INTERACTION ---
function startHold(){
  hold = true;
  holdStart = Date.now();
  breakPoint = randomBreak();
  broken = false;
}

function endHold(){
  hold = false;
}

canvas.addEventListener("touchstart", startHold, {passive:false});
canvas.addEventListener("touchend", endHold);

canvas.addEventListener("mousedown", startHold);
canvas.addEventListener("mouseup", endHold);

tick();

</script>

</body>
</html>
